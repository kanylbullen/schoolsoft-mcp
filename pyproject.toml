[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schoolsoft-mcp"
version = "0.1.0"
description = "Model Context Protocol server for SchoolSoft (unofficial)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "schoolsoft-mcp contributors" }]
keywords = ["mcp", "schoolsoft", "model-context-protocol", "school", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.6.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "typing-extensions>=4.10.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-beautifulsoup4>=4.12.0",
]
discover = [
    "playwright>=1.45.0",
]

[project.scripts]
schoolsoft-mcp = "schoolsoft_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/kanylbullen/schoolsoft-mcp"
Issues = "https://github.com/kanylbullen/schoolsoft-mcp/issues"
Repository = "https://github.com/kanylbullen/schoolsoft-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/schoolsoft_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "ASYNC",         # flake8-async
    "SIM",           # flake8-simplify
    "RUF",           # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Discovery is a one-shot dev script; sync filesystem ops inside an async
# main loop are fine here and we'd rather not pull in trio/anyio just for
# this. BLE001: broad-except is intentional — we want to log and continue
# crawling regardless of what Playwright throws.
"scripts/*" = ["ASYNC240", "BLE001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pypdf", "pypdf.*", "docx", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
